workflows:
  ios-build-check:
    name: iOS – kontrola sestavení
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Sestavení bez podpisu pro simulátor
        script: |
          set -eu
          xcodebuild -project MojeCentrum.xcodeproj -scheme MojeCentrum \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedData build/DerivedData CODE_SIGNING_ALLOWED=NO build
  ios-testflight:
    name: iOS – TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: MojeCentrum
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cz.kostelnicek.mojecentrum
    scripts:
      - name: Nastavení podpisu
        script: xcode-project use-profiles
      - name: Sestavení IPA
        script: |
          set -eu
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${PROJECT_BUILD_NUMBER:-1}" App/Info.plist
          xcode-project build-ipa --project MojeCentrum.xcodeproj --scheme MojeCentrum
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
